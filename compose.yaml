services:
  postgres:
    image: postgres:16
    container_name: licitaciones-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licitaciones_db}
      POSTGRES_USER: ${POSTGRES_USER:-licitaciones_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licitaciones_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - licitaciones_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-licitaciones_user} -d ${POSTGRES_DB:-licitaciones_db}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  licitaciones_postgres_data:
