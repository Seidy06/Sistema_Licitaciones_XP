services:
  db:
    image: postgres:16
    container_name: licitaciones-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-licitaciones_db}
      POSTGRES_USER: ${POSTGRES_USER:-licitaciones_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licitaciones_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - licitaciones_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-licitaciones_user} -d ${POSTGRES_DB:-licitaciones_db}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: licitaciones-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Licitaciones=Host=db;Port=5432;Database=${POSTGRES_DB:-licitaciones_db};Username=${POSTGRES_USER:-licitaciones_user};Password=${POSTGRES_PASSWORD:-licitaciones_password}
      - Database__ApplyMigrationsOnStartup=true
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  licitaciones_postgres_data:
