name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: licitaciones_user
          POSTGRES_PASSWORD: licitaciones_password
          POSTGRES_DB: licitaciones_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U licitaciones_user -d licitaciones_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Preparar referencia main para las pruebas de entrega
        if: github.event_name == 'pull_request'
        run: git branch main origin/main

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restaurar dependencias
        run: dotnet restore Licitaciones.sln

      - name: Verificar formato
        run: dotnet format Licitaciones.sln --verify-no-changes --no-restore

      - name: Compilar solución
        run: dotnet build Licitaciones.sln --configuration Release --no-restore

      - name: Instalar navegadores de Playwright
        run: pwsh tests/Licitaciones.E2ETests/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Ejecutar pruebas con cobertura
        run: >-
          dotnet test Licitaciones.sln --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./cobertura
        env:
          LICITACIONES_INTEGRATION_CONNECTION_STRING: "Host=127.0.0.1;Port=5432;Database=licitaciones_db;Username=licitaciones_user;Password=licitaciones_password"

      - name: Construir imagen de la API
        run: docker build -f Dockerfile -t licitaciones-api:ci .

      - name: Instalar kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validar manifiestos de Kubernetes
        run: kubeconform -strict -summary k8s/

      - name: Auditar dependencias vulnerables
        run: dotnet list package --vulnerable
