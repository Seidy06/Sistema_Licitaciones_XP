apiVersion: apps/v1
kind: Deployment
metadata:
  name: licitaciones-api
  labels:
    app: licitaciones-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: licitaciones-api
  template:
    metadata:
      labels:
        app: licitaciones-api
    spec:
      containers:
        - name: licitaciones-api
          image: licitaciones-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Licitaciones
              valueFrom:
                secretKeyRef:
                  name: licitaciones-secret
                  key: ConnectionStrings__Licitaciones
            - name: Database__ApplyMigrationsOnStartup
              valueFrom:
                configMapKeyRef:
                  name: licitaciones-config
                  key: Database__ApplyMigrationsOnStartup
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
